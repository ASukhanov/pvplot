[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pvplot"
version = "1.7.0"
authors = [
  { name="Andrey Sukhanov", email="cyxandr@gmail.com" },
]
description = "Plotting tool for EPICS PVs, ADO and LITE parameters"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "liteaccess",
    "numpy",
    "pyqtgraph",
    "qtpy",
    "PyQt5",
    "caproto",
    "p4p",
]

[project.urls]
"Homepage" = "https://github.com/ASukhanov/pvplot"
"Bug Tracker" = "https://github.com/ASukhanov/pvplot/issues"

[dependency-groups]
dev = [
    "pylint>=2.13.9",
]
